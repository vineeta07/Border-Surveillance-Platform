<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Outer Hexagon Radar Frame -->
  <polygon points="256,70 420,165 420,355 256,450 92,355 92,165" fill="none" stroke="url(#emerald-glow)" stroke-width="12" filter="url(#glow)" opacity="0.8" />
  
  <!-- Radar Crosshairs -->
  <circle cx="256" cy="260" r="110" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="260" r="60" fill="none" stroke="#10b981" stroke-width="3" opacity="0.6" />
  <line x1="256" y1="120" x2="256" y2="400" stroke="#334155" stroke-width="3" />
  <line x1="116" y1="260" x2="396" y2="260" stroke="#334155" stroke-width="3" />
  
  <!-- Target Center & Reticle -->
  <polygon points="256,225 290,260 256,295 222,260" fill="url(#emerald-glow)" filter="url(#glow)" />
  <circle cx="256" cy="260" r="8" fill="#ffffff" />
  
  <!-- Corner Tech HUD Marks -->
  <path d="M 170 180 L 140 180 L 140 210" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <path d="M 342 180 L 372 180 L 372 210" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <path d="M 140 310 L 140 340 L 170 340" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <path d="M 372 310 L 372 340 L 342 340" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  
  <!-- Text Label -->
  <text x="256" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="34" font-weight="900" fill="#10b981" letter-spacing="8">IBVAP</text>
</svg>
